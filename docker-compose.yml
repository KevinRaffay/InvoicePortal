services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: invoiceportal-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  db-init:
    build:
      context: .
      dockerfile: InvoicePortal.DbInit/Dockerfile
    container_name: invoiceportal-db-init
    depends_on:
      sql:
        condition: service_healthy
    environment:
      SQL_SERVER: sql
      DB_NAME: ${DB_NAME}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      BACPAC_PATH: /bacpac/source.bacpac
    volumes:
      - ./mec-invoiceportal-prod.bacpac:/bacpac/source.bacpac:ro
    restart: "no"

  app:
    build:
      context: .
      dockerfile: InvoicePortal.Admin/Dockerfile
    container_name: invoiceportal-app
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__InvoicePortal: "Server=sql,1433;Database=${DB_NAME};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      # AI feature flags. Set Ai__Enabled: "false" to hide the AI UI.
      Ai__Enabled: "true"
      Ai__DocumentChatEnabled: "true"
      # AI_PROVIDER=Mock (default, offline fake) or Ollama (real local model). Values come from .env.
      # With Ollama installed on the Windows host (uses the GPU), the default endpoint below already works.
      # For the CPU-only sidecar instead: `docker compose --profile ollama up -d` and set
      # AI_OLLAMA_ENDPOINT=http://ollama:11434 in .env.
      Ai__Provider: ${AI_PROVIDER:-Mock}
      Ai__Ollama__Endpoint: ${AI_OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      Ai__Ollama__Model: ${AI_OLLAMA_MODEL:-qwen2.5-coder:7b}
      # OpenTelemetry. Empty (default) exports nothing. With the otel profile below:
      # OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889 in .env, then open http://localhost:18888.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Telemetry__RecordSqlText: ${TELEMETRY_RECORD_SQL_TEXT:-false}

  # Optional local telemetry sink: the standalone .NET Aspire Dashboard (traces, metrics, structured logs).
  # No storage; everything is in memory and gone when the container stops. Started only with --profile otel.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: invoiceportal-otel
    profiles: ["otel"]
    ports:
      - "18888:18888"   # dashboard UI
      - "18889:18889"   # OTLP gRPC ingest (used by the app container and by host-side dotnet run)
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  # Optional, CPU-only local model inside Docker (no WSL/GPU needed). Started only with --profile ollama.
  # Needs the Docker Desktop VM raised to ~12 GB (Settings > Resources); a 7B model does not fit in 4 GB.
  # First run: docker compose exec ollama ollama pull ${AI_OLLAMA_MODEL:-qwen2.5-coder:7b}
  ollama:
    image: ollama/ollama:latest
    container_name: invoiceportal-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"

volumes:
  mssql-data:
  ollama-data:
