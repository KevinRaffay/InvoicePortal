services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: invoiceportal-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  db-init:
    build:
      context: .
      dockerfile: InvoicePortal.DbInit/Dockerfile
    container_name: invoiceportal-db-init
    depends_on:
      sql:
        condition: service_healthy
    environment:
      SQL_SERVER: sql
      DB_NAME: ${DB_NAME}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      BACPAC_PATH: /bacpac/source.bacpac
    volumes:
      - ./mec-invoiceportal-prod.bacpac:/bacpac/source.bacpac:ro
    restart: "no"

  app:
    build:
      context: .
      dockerfile: InvoicePortal.Admin/Dockerfile
    container_name: invoiceportal-app
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__InvoicePortal: "Server=sql,1433;Database=${DB_NAME};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      # AI feature flags (mock provider: no keys, no network). Set Ai__Enabled: "false" to hide the AI UI.
      Ai__Enabled: "true"
      Ai__DocumentChatEnabled: "true"
      Ai__Provider: Mock

volumes:
  mssql-data:
